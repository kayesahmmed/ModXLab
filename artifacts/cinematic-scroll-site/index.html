    <script>
      (function() {
        function updateViewport() {
          var width = window.screen.width;
          var screenWidth = Math.min(window.screen.width, window.screen.height);
          if (window.orientation === 90 || window.orientation === -90) {
            screenWidth = Math.max(window.screen.width, window.screen.height);
          }
          var scale = screenWidth / 980;
          var meta = document.getElementById('viewport-meta');
          if (meta) {
            if (scale < 1) {
              meta.setAttribute('content', 'width=980, initial-scale=' + scale + ', maximum-scale=' + scale + ', minimum-scale=' + scale + ', user-scalable=no, shrink-to-fit=no');
            } else {
              meta.setAttribute('content', 'width=980, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no');
            }
          }
        }
        updateViewport();
        window.addEventListener('orientationchange', updateViewport);
        window.addEventListener('resize', updateViewport);
      })();
